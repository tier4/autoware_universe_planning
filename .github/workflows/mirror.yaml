name: mirror

on:
  schedule:
    - cron: 0,30 * * * *
  workflow_call:
  workflow_dispatch:

concurrency:
  group: mirror
  cancel-in-progress: false

env:
  # Pinned: git-filter-repo is deterministic for a given version, but a
  # different version may rewrite differently and would republish every branch.
  FILTER_REPO_VERSION: 2.47.0
  DOWNSTREAM: https://github.com/${{ github.repository }}.git

jobs:
  plan:
    # The matrices below come from .sync/sources.yaml, so adding a mirror is a
    # configuration change and never a workflow change.
    runs-on: ubuntu-24.04
    outputs:
      sources: ${{ steps.plan.outputs.sources }}
      combined: ${{ steps.plan.outputs.combined }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml
        shell: bash

      - name: Read the mirror configuration
        id: plan
        run: |
          tools/sync_config.py validate
          echo "sources=$(tools/mirror.py list-sources)" >>"$GITHUB_OUTPUT"
          echo "combined=$(tools/mirror.py list-combined)" >>"$GITHUB_OUTPUT"
        shell: bash

  mirror:
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJson(needs.plan.outputs.sources) }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --disable-pip-version-check \
            pyyaml "git-filter-repo==${FILTER_REPO_VERSION}"
        shell: bash

      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Set git config
        uses: autowarefoundation/autoware-github-actions/set-git-config@v1
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Filter and publish the mirror branch
        run: |
          tools/mirror.py mirror "${{ matrix.source }}" \
            --work "${RUNNER_TEMP}/mirror" --downstream "${DOWNSTREAM}" --push
        shell: bash

  combine:
    # Reads the mirror branches that the previous job published, so the
    # combined branch can never disagree with the per-source mirrors.
    needs: [plan, mirror]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan.outputs.combined) }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml
        shell: bash

      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Set git config
        uses: autowarefoundation/autoware-github-actions/set-git-config@v1
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Replay into the combined branch
        # --verify rebuilds from scratch a second time and fails unless both
        # builds produce the same commit id.
        run: |
          tools/mirror.py combine "${{ matrix.target }}" \
            --work "${RUNNER_TEMP}/combine" --downstream "${DOWNSTREAM}" --verify --push
        shell: bash
